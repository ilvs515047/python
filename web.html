<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簡易 WebCam 相機</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #333;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 640px;
            width: 100%;
        }

        /* 影片顯示區域 */
        #videoElement {
            width: 100%;
            height: auto;
            background-color: #000;
            border-radius: 8px;
            transform: scaleX(-1); /* 鏡像翻轉，讓畫面看起來像鏡子 */
        }

        /* 按鈕區域 */
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }

        #startBtn { background-color: #28a745; color: white; }
        #startBtn:hover { background-color: #218838; }

        #stopBtn { background-color: #dc3545; color: white; }
        #stopBtn:hover { background-color: #c82333; }
        #stopBtn:disabled { background-color: #e2e6ea; cursor: not-allowed; }

        #snapBtn { background-color: #007bff; color: white; }
        #snapBtn:hover { background-color: #0069d9; }
        #snapBtn:disabled { background-color: #e2e6ea; cursor: not-allowed; }

        /* 截圖結果區域 */
        .gallery {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .gallery img {
            width: 150px;
            border-radius: 4px;
            border: 2px solid #ddd;
            transform: scaleX(-1); /* 照片也做鏡像，保持一致 */
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>WebCam 網頁相機</h1>
        
        <video id="videoElement" autoplay playsinline></video>
        
        <canvas id="canvas" style="display:none;"></canvas>

        <div class="controls">
            <button id="startBtn">開啟相機</button>
            <button id="stopBtn" disabled>關閉相機</button>
            <button id="snapBtn" disabled>📸 拍照</button>
        </div>

        <div id="gallery" class="gallery"></div>
    </div>

    <script>
        const video = document.getElementById('videoElement');
        const canvas = document.getElementById('canvas');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const snapBtn = document.getElementById('snapBtn');
        const gallery = document.getElementById('gallery');
        let stream = null;

        // 1. 開啟相機
        startBtn.addEventListener('click', async () => {
            try {
                // 請求使用視訊
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                
                // 更新按鈕狀態
                startBtn.disabled = true;
                stopBtn.disabled = false;
                snapBtn.disabled = false;
            } catch (err) {
                console.error("無法存取相機:", err);
                alert("無法存取相機，請確認您已允許瀏覽器使用權限。");
            }
        });

        // 2. 關閉相機
        stopBtn.addEventListener('click', () => {
            if (stream) {
                const tracks = stream.getTracks();
                tracks.forEach(track => track.stop()); // 停止所有視訊軌道
                video.srcObject = null;
                
                // 更新按鈕狀態
                startBtn.disabled = false;
                stopBtn.disabled = true;
                snapBtn.disabled = true;
            }
        });

        // 3. 拍照功能
        snapBtn.addEventListener('click', () => {
            // 設定 Canvas 大小與影片一致
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // 將目前的影片畫面繪製到 Canvas 上
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // 將 Canvas 轉為圖片 URL
            const dataURL = canvas.toDataURL('image/png');
            
            // 建立新的 img 元素並顯示
            const img = document.createElement('img');
            img.src = dataURL;
            gallery.prepend(img); // 將新照片加到最前面
        });
    </script>

</body>
</html>
