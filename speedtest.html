<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快門速度檢測工具</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #eee;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            overflow: hidden;
        }
        #track {
            width: 100%;
            height: 300px;
            background-color: #000;
            position: relative;
            border-bottom: 2px solid #444;
            margin-top: 20px;
        }
        #moving-bar {
            width: 4px;
            height: 100%;
            background-color: #fff;
            position: absolute;
            left: 0;
            box-shadow: 0 0 10px #fff;
        }
        .controls {
            padding: 20px;
            background: #333;
            width: 100%;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .info {
            margin-top: 10px;
            color: #00ff00;
            font-family: monospace;
        }
        input { width: 200px; }
        label { font-weight: bold; }
    </style>
</head>
<body>

    <div id="track">
        <div id="moving-bar"></div>
    </div>

    <div class="controls">
        <div>
            <label>移動速度 (像素/秒): </label>
            <input type="range" id="speedRange" min="100" max="5000" value="1000">
            <span id="speedValue">1000</span> px/s
        </div>
    </div>

    <div class="info">
        <p>公式：快門時間 $T = \frac{\text{照片中線條的寬度 (px)}}{\text{移動速度 (px/s)}}$</p>
        <p>提示：請將相機垂直於螢幕拍攝，並確保快門足以產生動態模糊。</p>
    </div>

    <script>
        const bar = document.getElementById('moving-bar');
        const speedInput = document.getElementById('speedRange');
        const speedDisplay = document.getElementById('speedValue');
        
        let position = 0;
        let direction = 1;
        let lastTimestamp = 0;

        function animate(timestamp) {
            if (!lastTimestamp) lastTimestamp = timestamp;
            const deltaTime = (timestamp - lastTimestamp) / 1000; // 轉換為秒
            const speed = parseInt(speedInput.value);
            
            position += speed * deltaTime * direction;

            // 碰到邊框反彈
            if (position >= window.innerWidth - 4) {
                direction = -1;
            } else if (position <= 0) {
                direction = 1;
            }

            bar.style.transform = `translateX(${position}px)`;
            
            lastTimestamp = timestamp;
            requestAnimationFrame(animate);
        }

        speedInput.addEventListener('input', () => {
            speedDisplay.textContent = speedInput.value;
        });

        requestAnimationFrame(animate);
    </script>
</body>
</html>
