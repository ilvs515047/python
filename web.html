<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專業 WebCam 檢測工具</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #2c3e50; /* 改深色背景，對比度較好 */
            color: white;
            margin: 0;
            padding: 20px;
        }

        h1 { margin-bottom: 10px; }

        .container {
            background: #34495e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 800px; /* 加寬畫面 */
            width: 100%;
        }

        /* 影片顯示區域 */
        .video-wrapper {
            position: relative;
            width: 100%;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #555;
        }

        #videoElement {
            width: 100%;
            height: auto;
            display: block;
            /* 預設不鏡像 (工業用途通常看正像) */
            transform: scaleX(1); 
        }

        /* 控制面板 */
        .controls {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            align-items: center;
            padding: 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
        }

        select {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 14px;
            max-width: 200px;
        }

        button {
            padding: 10px 20px;
            font-size: 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        #startBtn { background-color: #27ae60; color: white; }
        #startBtn:hover { background-color: #2ecc71; }

        #stopBtn { background-color: #c0392b; color: white; }
        #stopBtn:hover { background-color: #e74c3c; }
        #stopBtn:disabled { background-color: #7f8c8d; cursor: not-allowed; }

        #snapBtn { background-color: #2980b9; color: white; }
        #snapBtn:hover { background-color: #3498db; }
        #snapBtn:disabled { background-color: #7f8c8d; cursor: not-allowed; }

        /* 鏡像開關 */
        .toggle-container {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
            cursor: pointer;
        }

        /* 截圖結果 */
        .gallery {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .gallery img {
            width: 160px;
            border-radius: 4px;
            border: 2px solid #fff;
            transition: transform 0.2s;
        }
        .gallery img:hover { transform: scale(1.1); }

        /* 狀態訊息 */
        #statusMsg {
            color: #f1c40f;
            font-size: 0.9em;
            margin-top: 5px;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔍 專業檢測相機 (自動白平衡版)</h1>
        
        <div class="video-wrapper">
            <video id="videoElement" autoplay playsinline></video>
        </div>
        
        <div id="statusMsg">準備就緒</div>

        <canvas id="canvas" style="display:none;"></canvas>

        <div class="controls">
            <select id="cameraSelect">
                <option value="">載入中...</option>
            </select>

            <label class="toggle-container">
                <input type="checkbox" id="mirrorToggle"> 鏡像翻轉
            </label>

            <button id="startBtn">啟動相機</button>
            <button id="stopBtn" disabled>關閉</button>
            <button id="snapBtn" disabled>📸 截圖</button>
        </div>

        <div id="gallery" class="gallery"></div>
    </div>

    <script>
        const video = document.getElementById('videoElement');
        const canvas = document.getElementById('canvas');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const snapBtn = document.getElementById('snapBtn');
        const cameraSelect = document.getElementById('cameraSelect');
        const mirrorToggle = document.getElementById('mirrorToggle');
        const gallery = document.getElementById('gallery');
        const statusMsg = document.getElementById('statusMsg');
        
        let stream = null;

        // 1. 初始化：列出所有可用的相機裝置
        async function getCameras() {
            try {
                // 先請求一次權限，否則 enumerateDevices 可能拿不到標籤名稱
                await navigator.mediaDevices.getUserMedia({ video: true });
                const devices = await navigator.mediaDevices.enumerateDevices();
                
                cameraSelect.innerHTML = ""; // 清空
                const videoDevices = devices.filter(device => device.kind === 'videoinput');

                videoDevices.forEach((device, index) => {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    option.text = device.label || `攝影機 ${index + 1}`;
                    cameraSelect.appendChild(option);
                });
                
                statusMsg.innerText = `偵測到 ${videoDevices.length} 個攝影機，請選擇並啟動`;
            } catch (err) {
                console.error(err);
                statusMsg.innerText = "請允許攝影機權限以讀取裝置列表";
            }
        }

        // 頁面載入時先執行一次搜尋
        getCameras();

        // 2. 啟動相機 (包含白平衡修正核心代碼)
        startBtn.addEventListener('click', async () => {
            if (stream) {
                // 如果已經開啟，先關閉舊的
                stream.getTracks().forEach(track => track.stop());
            }

            const deviceId = cameraSelect.value;
            const constraints = {
                video: {
                    deviceId: deviceId ? { exact: deviceId } : undefined,
                    width: { ideal: 1920 },  // 嘗試請求 1080p
                    height: { ideal: 1080 },
                    // --- 關鍵修改：嘗試強制請求連續白平衡 ---
                    advanced: [{ whiteBalanceMode: "continuous" }] 
                }
            };

            try {
                statusMsg.innerText = "正在啟動相機並調整設定...";
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;

                // --- 二次確認：檢查並套用白平衡 ---
                const track = stream.getVideoTracks()[0];
                const capabilities = track.getCapabilities();

                if (capabilities.whiteBalanceMode) {
                    // 如果相機支援，再次強制送出指令
                    await track.applyConstraints({
                        advanced: [{ whiteBalanceMode: "continuous" }]
                    });
                    statusMsg.innerText = "✅ 已啟動 (自動白平衡模式已送出)";
                } else {
                    statusMsg.innerText = "⚠️ 已啟動 (此相機驅動可能不支援軟體控制白平衡)";
                }

                startBtn.disabled = true;
                stopBtn.disabled = false;
                snapBtn.disabled = false;
            } catch (err) {
                console.error(err);
                statusMsg.innerText = "❌ 無法啟動相機：" + err.name;
                alert("無法啟動，請確認沒有其他程式(如OBS)正在佔用相機。");
            }
        });

        // 3. 關閉相機
        stopBtn.addEventListener('click', () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                video.srcObject = null;
                startBtn.disabled = false;
                stopBtn.disabled = true;
                snapBtn.disabled = true;
                statusMsg.innerText = "相機已關閉";
            }
        });

        // 4. 拍照
        snapBtn.addEventListener('click', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            
            // 處理鏡像
            if (mirrorToggle.checked) {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }
            
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const dataURL = canvas.toDataURL('image/jpeg', 0.9); // 存成 JPG 畫質 0.9
            const img = document.createElement('img');
            img.src = dataURL;
            
            // 讓照片的鏡像狀態跟拍攝時一樣
            if (mirrorToggle.checked) {
                img.style.transform = "scaleX(-1)";
            }
            
            gallery.prepend(img);
        });

        // 5. 鏡像開關控制
        mirrorToggle.addEventListener('change', (e) => {
            video.style.transform = e.target.checked ? "scaleX(-1)" : "scaleX(1)";
        });
    </script>

</body>
</html>
