<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yi Camera USB 控制中心</title>
    <style>
        :root { --bg: #121212; --surface: #1e1e1e; --primary: #00bcd4; --text: #e0e0e0; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        h2 { margin-top: 20px; font-weight: 300; }
        
        .main-container { width: 95%; max-width: 900px; display: flex; flex-direction: column; gap: 20px; align-items: center; }
        
        /* 視訊區塊 */
        .video-box {
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            position: relative;
        }
        video { width: 100%; display: block; transform: scaleX(-1); /* 鏡像翻轉，可依需求移除 */ }

        /* 控制面板 */
        .controls-panel {
            width: 100%;
            background: var(--surface);
            padding: 20px;
            border-radius: 12px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .control-group { background: #2a2a2a; padding: 15px; border-radius: 8px; }
        .control-group label { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; }
        
        input[type=range] { width: 100%; cursor: pointer; }
        
        /* 按鈕與狀態 */
        .btn-start {
            padding: 12px 30px; background: var(--primary); color: #000; border: none; 
            border-radius: 30px; font-weight: bold; cursor: pointer; font-size: 1rem;
            transition: transform 0.2s;
        }
        .btn-start:hover { transform: scale(1.05); filter: brightness(1.1); }
        
        .status-log { 
            width: 100%; font-family: monospace; font-size: 0.9rem; color: #888; 
            background: #000; padding: 10px; border-radius: 8px; min-height: 60px;
        }
        
        .unsupported { color: #ff5252; font-size: 0.8em; }
    </style>
</head>
<body>

    <h2>Yi Camera USB Controller</h2>

    <div class="main-container">
        <button class="btn-start" onclick="startCamera()">🔌 連接並啟動攝影機</button>
        
        <div class="video-box">
            <video id="video" autoplay playsinline></video>
        </div>

        <div class="controls-panel" id="controlsPanel" style="display:none;">
            <div class="control-group">
                <label>縮放 (Zoom) <span id="val-zoom">0</span></label>
                <input type="range" id="input-zoom" disabled>
                <span id="msg-zoom" class="unsupported"></span>
            </div>

            <div class="control-group">
                <label>水平旋轉 (Pan) <span id="val-pan">0</span></label>
                <input type="range" id="input-pan" disabled>
                <span id="msg-pan" class="unsupported"></span>
            </div>

            <div class="control-group">
                <label>垂直傾斜 (Tilt) <span id="val-tilt">0</span></label>
                <input type="range" id="input-tilt" disabled>
                <span id="msg-tilt" class="unsupported"></span>
            </div>
        </div>

        <div class="status-log" id="logs">等待連接...</div>
    </div>

    <script>
        const video = document.getElementById('video');
        const logBox = document.getElementById('logs');
        let videoTrack;
        let capabilities;

        function log(msg) {
            logBox.innerHTML += `> ${msg}<br>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        async function startCamera() {
            try {
                log("正在請求攝影機權限...");
                // 關鍵：請求 pan, tilt, zoom 權限
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 1920 },
                        height: { ideal: 1080 },
                        pan: true, 
                        tilt: true, 
                        zoom: true
                    }
                });

                video.srcObject = stream;
                videoTrack = stream.getVideoTracks()[0];
                
                // 顯示控制面板
                document.getElementById('controlsPanel').style.display = 'grid';
                document.querySelector('.btn-start').style.display = 'none';

                log(`已連接設備: ${videoTrack.label}`);
                
                // 檢查設備能力 (Capabilities)
                checkCapabilities();

            } catch (err) {
                log(`❌ 錯誤: ${err.name} - ${err.message}`);
                alert("無法連接攝影機，請確認 USB 連接正常且允許瀏覽器存取。");
            }
        }

        function checkCapabilities() {
            // 獲取硬體支援的功能列表
            capabilities = videoTrack.getCapabilities();
            const settings = videoTrack.getSettings();

            log("正在偵測硬體控制功能...");

            setupControl('zoom', capabilities.zoom, settings.zoom);
            setupControl('pan', capabilities.pan, settings.pan);
            setupControl('tilt', capabilities.tilt, settings.tilt);
        }

        function setupControl(name, cap, currentVal) {
            const input = document.getElementById(`input-${name}`);
            const msg = document.getElementById(`msg-${name}`);
            const valDisplay = document.getElementById(`val-${name}`);

            if (cap) {
                // 如果硬體支援
                input.min = cap.min;
                input.max = cap.max;
                input.step = cap.step;
                input.value = currentVal;
                input.disabled = false;
                valDisplay.innerText = currentVal;
                
                log(`✅ 支援 ${name}: 範圍 ${cap.min} ~ ${cap.max}`);

                // 綁定事件
                input.oninput = async (event) => {
                    const value = parseFloat(event.target.value);
                    valDisplay.innerText = value;
                    
                    const constraints = { advanced: [{ [name]: value }] };
                    try {
                        await videoTrack.applyConstraints(constraints);
                    } catch (err) {
                        log(`控制失敗 ${name}: ${err}`);
                    }
                };
            } else {
                // 如果硬體不支援
                msg.innerText = "此裝置硬體不支援或是驅動程式未開放此功能";
                log(`⚠️ 不支援 ${name}`);
            }
        }
    </script>
</body>
</html>
