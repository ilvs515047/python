<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yi Camera UVC 全功能調試 + 拍照</title>
    <style>
        :root { --bg: #121212; --surface: #1e1e1e; --primary: #00e676; --secondary: #ff9800; --text: #e0e0e0; }
        body { font-family: 'Segoe UI', monospace; background: var(--bg); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 15px; position: relative; }
        
        /* 影片區域與閃光特效 */
        .video-wrapper { position: relative; width: 100%; border-radius: 8px; overflow: hidden; border: 1px solid #333; }
        video { width: 100%; background: #000; display: block; }
        #flash-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; pointer-events: none; transition: opacity 0.1s;
        }

        .panel { background: var(--surface); padding: 15px; border-radius: 8px; border: 1px solid #333; }
        
        h3 { margin: 0 0 15px 0; border-bottom: 1px solid #444; padding-bottom: 5px; color: var(--primary); }
        
        .control-row { display: flex; align-items: center; margin-bottom: 12px; gap: 10px; }
        .control-row label { flex: 0 0 120px; font-size: 0.9rem; }
        .control-row input[type=range] { flex: 1; cursor: pointer; }
        .control-row span { flex: 0 0 50px; text-align: right; font-family: monospace; }
        
        select { background: #333; color: white; border: 1px solid #555; padding: 5px; border-radius: 4px; }
        
        .log-box { font-family: monospace; font-size: 0.8rem; color: #888; height: 150px; overflow-y: auto; background: #000; padding: 10px; border: 1px solid #333; }

        .btn-group { display: flex; gap: 10px; }
        button { 
            padding: 15px; font-size: 1.1rem; border: none; font-weight: bold; cursor: pointer; border-radius: 8px; flex: 1;
        }
        button.start-btn { background: var(--primary); color: #000; }
        button.photo-btn { background: var(--secondary); color: #000; display: none; } /* 預設隱藏，啟動後顯示 */
        
        button:active { filter: brightness(0.9); transform: scale(0.98); }
    </style>
</head>
<body>

<div class="container">
    <div class="btn-group">
        <button class="start-btn" onclick="initCamera()">🚀 啟動並掃描功能</button>
        <button class="photo-btn" onclick="takePhoto()">📸 拍照存檔</button>
    </div>

    <div class="video-wrapper">
        <video id="preview" autoplay playsinline></video>
        <div id="flash-overlay"></div>
    </div>
    
    <div id="controls-area"></div>
    
    <div class="panel">
        <h3>偵測日誌 (Log)</h3>
        <div class="log-box" id="logs"></div>
    </div>
</div>

<script>
    const video = document.getElementById('preview');
    const controlsArea = document.getElementById('controls-area');
    const logBox = document.getElementById('logs');
    const flashOverlay = document.getElementById('flash-overlay');
    let track;

    // 定義所有可能的 UVC 標準控制項目
    const KNOWN_CAPABILITIES = [
        { key: 'brightness', name: '亮度 (Brightness)' },
        { key: 'contrast', name: '對比 (Contrast)' },
        { key: 'saturation', name: '飽和度 (Saturation)' },
        { key: 'sharpness', name: '銳利度 (Sharpness)' },
        { key: 'exposureCompensation', name: '曝光補償 (EV)' },
        { key: 'exposureTime', name: '曝光時間 (手動模式)' },
        { key: 'colorTemperature', name: '色溫 (Color Temp)' },
        { key: 'zoom', name: '縮放 (Zoom)' },
        { key: 'focusDistance', name: '對焦距離 (Focus)' } 
    ];

    const MODES = [
        { key: 'exposureMode', name: '曝光模式' },
        { key: 'whiteBalanceMode', name: '白平衡模式' },
        { key: 'focusMode', name: '對焦模式' }
    ];

    function log(msg) {
        const time = new Date().toLocaleTimeString();
        logBox.innerHTML += `[${time}] ${msg}<br>`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    async function initCamera() {
        try {
            log("正在請求最高權限...");
            const stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    width: { ideal: 1920 }, // 嘗試請求 Full HD
                    height: { ideal: 1080 },
                    advanced: KNOWN_CAPABILITIES.map(c => ({ [c.key]: true }))
                }
            });

            video.srcObject = stream;
            track = stream.getVideoTracks()[0];
            
            // 顯示拍照按鈕，隱藏啟動按鈕
            document.querySelector('.start-btn').style.display = 'none';
            document.querySelector('.photo-btn').style.display = 'block';

            setTimeout(scanCapabilities, 500);

        } catch (err) {
            log("❌ 錯誤: " + err.message);
        }
    }

    // --- 新增：拍照功能 ---
    function takePhoto() {
        if (!video.srcObject) return;

        // 1. 視覺閃光特效
        flashOverlay.style.opacity = 0.8;
        setTimeout(() => { flashOverlay.style.opacity = 0; }, 100);

        // 2. 建立 Canvas
        const canvas = document.createElement('canvas');
        // 關鍵：使用影片的原始解析度，而不是 CSS 顯示的大小
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // 3. 匯出並下載
        const dataURL = canvas.toDataURL('image/jpeg', 0.95); // 95% 品質 JPG
        const link = document.createElement('a');
        const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
        link.href = dataURL;
        link.download = `YiCam_Test_${timestamp}.jpg`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        log(`📸 已拍攝並下載: ${link.download} (${canvas.width}x${canvas.height})`);
    }
    // ---------------------

    function scanCapabilities() {
        const capabilities = track.getCapabilities();
        const settings = track.getSettings();
        
        log(`設備名稱: ${track.label}`);
        log(`當前解析度: ${video.videoWidth} x ${video.videoHeight}`);
        log("--- 開始掃描支援功能 ---");

        controlsArea.innerHTML = ""; 

        MODES.forEach(m => {
            if (m.key in capabilities) {
                createModeSelect(m, capabilities[m.key], settings[m.key]);
            }
        });

        KNOWN_CAPABILITIES.forEach(cap => {
            if (cap.key in capabilities) {
                createRangeSlider(cap, capabilities[cap.key], settings[cap.key]);
            }
        });
        
        log("--- 掃描完成 ---");
    }

    function createModeSelect(info, options, current) {
        const div = document.createElement('div');
        div.className = 'panel';
        div.innerHTML = `<div class="control-row"><label>${info.name}</label><select id="sel-${info.key}"></select></div>`;
        controlsArea.appendChild(div);

        const select = div.querySelector('select');
        options.forEach(opt => {
            const option = document.createElement('option');
            option.value = opt;
            option.text = opt;
            if (opt === current) option.selected = true;
            select.appendChild(option);
        });

        select.onchange = async (e) => {
            try {
                await track.applyConstraints({ advanced: [{ [info.key]: e.target.value }] });
                log(`設定 ${info.name} -> ${e.target.value}`);
            } catch (err) {
                log(`設定失敗: ${err.message}`);
            }
        };
    }

    function createRangeSlider(info, cap, current) {
        const div = document.createElement('div');
        div.className = 'panel';
        div.innerHTML = `
            <div class="control-row">
                <label>${info.name}</label>
                <input type="range" min="${cap.min}" max="${cap.max}" step="${cap.step}" value="${current}" id="rng-${info.key}">
                <span id="val-${info.key}">${current}</span>
            </div>
        `;
        controlsArea.appendChild(div);

        const input = div.querySelector('input');
        const valSpan = div.querySelector(`#val-${info.key}`);

        input.oninput = async (e) => {
            const val = parseFloat(e.target.value);
            valSpan.innerText = val;
            try {
                await track.applyConstraints({ advanced: [{ [info.key]: val }] });
            } catch (err) {}
        };
    }
</script>

</body>
</html>
